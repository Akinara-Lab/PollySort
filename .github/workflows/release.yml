name: Release

# Ausgelöst durch einen Versions-Tag:  git tag v0.4.0b2 && git push origin v0.4.0b2
#
# Der Ablauf ist bewusst dreistufig — bauen, PRÜFEN, erst dann veröffentlichen.
# Ein Wheel, das sich nicht installieren lässt, darf niemals auf PyPI landen: Dort
# lässt sich eine Version nicht ersetzen, nur zurückziehen (yanken).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # zum Proben ohne Tag (baut und prüft, veröffentlicht nicht)

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  #  1) Bauen
  # ------------------------------------------------------------------ #
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv installieren
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Version aus dem Tag gegen pyproject prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(uv run --with tomli python -c \
            "import tomli;print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag: $TAG · pyproject: $PROJ"
          # Ein Tag, der nicht zur Version im Paket passt, erzeugt ein Release, das
          # niemand mehr zuordnen kann. Lieber hier abbrechen.
          test "$TAG" = "$PROJ" || { echo "::error::Tag und pyproject-Version weichen ab"; exit 1; }

      - name: Bauen
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ------------------------------------------------------------------ #
  #  2) Prüfen — auf allen drei Betriebssystemen wirklich installieren
  # ------------------------------------------------------------------ #
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      # Aus dem gebauten Wheel installieren, NICHT aus dem Quellbaum: Nur so fällt auf,
      # wenn eine Datei nicht mitverpackt wurde.
      - name: Wheel installieren und starten
        shell: bash
        run: |
          uv venv --python 3.12
          uv pip install dist/*.whl
          uv run pollysort-cli --version
          uv run pollysort-cli doctor || true   # doctor endet je nach Umgebung mit 1/2

  # ------------------------------------------------------------------ #
  #  3) GitHub-Release anlegen
  # ------------------------------------------------------------------ #
  github_release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # nur dieser Job darf schreiben
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Beta-Versionen (0.4.0b1) sind Vorabversionen — GitHub soll das auch so zeigen.
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}

  # ------------------------------------------------------------------ #
  #  4) PyPI — erst aktiv, wenn dort ein Trusted Publisher eingerichtet ist
  # ------------------------------------------------------------------ #
  #
  # EINMALIGE EINRICHTUNG, bevor dieser Job etwas tut:
  #   1. Auf pypi.org unter „Publishing" einen Trusted Publisher anlegen:
  #      Owner `Akinara-Lab`, Repository `PollySort`, Workflow `release.yml`,
  #      Environment `pypi`.
  #   2. Im Repository unter Settings → Environments ein Environment `pypi` anlegen
  #      (dort lässt sich auch eine manuelle Freigabe verlangen — empfehlenswert).
  #   3. Repository-Variable `PUBLISH_TO_PYPI` auf `true` setzen.
  #
  # Bis dahin wird der Job übersprungen. Absichtlich: Ein fehlschlagender
  # Veröffentlichungs-Job bei jedem Tag wäre ein Dauerärgernis, und ein
  # versehentlich veröffentlichter Name lässt sich auf PyPI nicht mehr zurückholen.
  pypi:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC für Trusted Publishing — kein API-Token nötig
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
