name: CLA

# Fragt bei jedem Pull Request die Zustimmung zum Contributor License Agreement ab
# (siehe CLA.md) und hält sie in einer Signaturdatei fest.
#
# ⚠️ INAKTIV, bis die Repository-Variable `REQUIRE_CLA` auf `true` steht.
#
# EINMALIGE EINRICHTUNG:
#   1. CLA.md juristisch prüfen lassen — der Text ist bislang ein Entwurf.
#   2. Ein privates Repository für die Signaturen anlegen (z. B. `Akinara-Lab/cla-signatures`)
#      oder den Branch unten auf dieses Repo zeigen lassen.
#   3. Ein Personal Access Token mit Schreibrecht auf das Signatur-Repo als Secret
#      `CLA_TOKEN` hinterlegen. Der GITHUB_TOKEN reicht nicht: Er darf keine anderen
#      Repositories beschreiben.
#   4. Repository-Variable `REQUIRE_CLA` auf `true` setzen.
#
# Warum überhaupt: PollySort ist Open Core. Ohne CLA bleiben die Rechte an einem Beitrag
# bei der beitragenden Person, und Akinara dürfte ihn nicht ins kommerzielle Cockpit
# übernehmen. Rückwirkend einholen lässt sich das praktisch nie — deshalb muss das stehen,
# BEVOR der erste externe Pull Request kommt.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read          # Schreiben ins Signatur-Repo läuft über CLA_TOKEN
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >
      vars.REQUIRE_CLA == 'true' &&
      (github.event.issue.pull_request || github.event_name == 'pull_request_target')
    runs-on: ubuntu-latest
    steps:
      - name: Zustimmung prüfen
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: signatures/pollysort.json
          path-to-document: https://github.com/Akinara-Lab/PollySort/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot]
          custom-notsigned-prcomment: >
            Danke für den Beitrag! PollySort ist Open Core — damit dein Code auch im
            kommerziellen Cockpit verwendet werden darf, brauchen wir einmalig deine
            Zustimmung zum [CLA](https://github.com/Akinara-Lab/PollySort/blob/main/CLA.md).
            Ein Kommentar mit dem Satz unten genügt; er gilt dann für alle weiteren
            Beiträge. Magst du nicht zustimmen, ist das völlig in Ordnung — öffne dann
            bitte ein Issue mit der Idee, wir setzen sie unabhängig um.
          custom-pr-sign-comment: "Ich habe das CLA gelesen und stimme ihm zu."
          custom-allsigned-prcomment: "Alle Beitragenden haben zugestimmt — danke!"
