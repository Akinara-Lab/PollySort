[project]
name = "pollysort"
version = "0.4.0b1"
description = "PollySort — lernender, konsolenbasierter Dokumenten-Archivar (Developed by Akinara)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Akinara" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["document-management", "file-organizer", "llm", "ollama", "cli", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: System :: Filesystems",
]
# Kern — bewusst schlank gehalten, damit `pipx install` / `uv tool install` auf
# jedem OS ohne Kompilier-/Wheel-Probleme durchläuft. Alles Optionale steht in
# [optional-dependencies] und wird per Extra dazugeholt (siehe README).
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "watchdog>=4.0",
    "pyreadline3; sys_platform == 'win32'",
    # pure-Python, überall installierbar — nötig, damit die LOKALE KI (Ollama) PDFs
    # lesen kann: die kennt keine Datei-Anhänge, der Text wird lokal extrahiert.
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/Akinara-Lab/PollySort"
Repository = "https://github.com/Akinara-Lab/PollySort"
Issues = "https://github.com/Akinara-Lab/PollySort/issues"
Changelog = "https://github.com/Akinara-Lab/PollySort/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Bessere Text-Extraktion (DOCX/CSV/HTML → Markdown) und MIME-Erkennung via libmagic.
# python-magic-bin ist auf Windows nötig, aber unmaintained → daher NICHT im Kern.
# Ohne dieses Extra fällt das Tool auf `mimetypes` + rohes Textlesen zurück (funktioniert).
extract = [
    "markitdown>=0.0.1a2",
    "python-magic; sys_platform != 'win32'",
    "python-magic-bin; sys_platform == 'win32'",
]
# Schneller Vektor-Store (noch nicht verdrahtet, s. TODO) — hinter demselben HiveMind-Interface.
vec = ["sqlite-vec>=0.1.1"]
# Laufzeit für BeeNara, das lokale Entscheider-Modell (ONNX auf der CPU, kein torch). Das
# Modell selbst holt `beenara laden` von Hugging Face und installiert dieses Extra mit, falls
# es fehlt — gleiche Liste wie beenara.PAKETE.
beenara = ["onnxruntime>=1.30", "tokenizers>=0.20", "numpy>=1.26"]
# Alles Optionale auf einmal.
full = ["pollysort[extract,beenara]"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
pollysort = "pollysort.repl:main"          # interaktive Konsole (primär)
pollysort-cli = "pollysort.cli:app"        # Scripting-/Skript-CLI (sekundär)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pollysort"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E402: cli.py muss stdout vor den Imports auf UTF-8 stellen (Windows-Konsole).
# B904: `raise typer.Exit(...)` in except-Blöcken ist das idiomatische CLI-Muster.
# B905: zip() über gleich lange Vektoren (Länge vorher geprüft).
# UP042: str+Enum ist bewusst gewählt (JSON-/DB-Serialisierung der Werte).
ignore = ["E402", "B904", "B905", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
